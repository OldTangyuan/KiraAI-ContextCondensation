<!-- 黑夜主题 ZIP 图标 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- 黑夜主题背景渐变 -->
    <linearGradient id="nightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- 黑夜主题图标渐变 -->
    <linearGradient id="nightIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <!-- 黑夜主题阴影 -->
    <filter id="nightShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景底板 -->
  <rect width="64" height="64" rx="14" fill="url(#nightBg)" stroke="#334155" stroke-width="2" filter="url(#nightShadow)"/>
  
  <!-- 核心图形：文件夹 + 向下箭头 -->
  <g fill="none" stroke="url(#nightIcon)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- 文件夹主体 -->
    <rect x="14" y="24" width="36" height="24" rx="4" />
    <!-- 文件夹标签 -->
    <path d="M30 24 L28 20 L36 20 L38 24" />
    <!-- 向下箭头主体 -->
    <line x1="32" y1="28" x2="32" y2="40" />
    <!-- 向下箭头头部 -->
    <path d="M27 36 L32 43 L37 36" />
  </g>
  
  <!-- 底部文字标识 -->
  <text x="32" y="56" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="10" fill="url(#nightIcon)" text-anchor="middle" letter-spacing="1">ZIP</text>
</svg>